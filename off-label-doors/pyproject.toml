[project]
name = "off-label-doors"
version = "0.1.0"
description = "Try Benjamin Moore navy paint colors on one front door: official color data, a paint chip, and an AI repaint of just the door."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.0.0",
    "pillow>=13.0.0",
    "pixeltable>=0.7.23",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
]

[[tool.pixeltable.database]]
# The local database. vars.<name> sets the value of the ConfigVar called <name>, for example:
# vars.media_dest = 's3://bucket/prefix'
# A hosted database gets a second entry, with name = 'pxt://org:db'.
