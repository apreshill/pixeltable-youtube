[project]
name = "check-llm-output"
version = "0.1.0"
description = "Ask Gemini about six photos with a Pydantic model, keep each answer next to the error that explains it, and see what pxt.Json[Model] checks."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.34",
    "pixeltable>=0.7.25",
    "pydantic>=2.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
]

[[tool.pixeltable.database]]
# The local database. vars.<name> sets the value of the ConfigVar called <name>, for example:
# vars.media_dest = 's3://bucket/prefix'
# A hosted database gets a second entry, with name = 'pxt://org:db'.
