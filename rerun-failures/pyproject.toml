[project]
name = "rerun-failures"
version = "0.1.0"
description = "Run 1,673 photos through a computed column, keep every result that worked, and rerun only the failures."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pixeltable>=0.7.23",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
]

[[tool.pixeltable.database]]
# The local database. vars.<name> sets the value of the ConfigVar called <name>, for example:
# vars.media_dest = 's3://bucket/prefix'
# A hosted database gets a second entry, with name = 'pxt://org:db'.
