[project]
name = "branded-newsletter-visuals"
version = "0.1.0"
description = "One newsletter issue becomes a branded cover and a short video."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.33.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "notebook>=7.6.3",
    "pillow>=13.0.0",
    "pixeltable>=0.7.24",
]

[[tool.pixeltable.database]]
# The local database. vars.<name> sets the value of the ConfigVar called <name>, for example:
# vars.media_dest = 's3://bucket/prefix'
# A hosted database gets a second entry, with name = 'pxt://org:db'.
