[project]
name = "keep-failed-answers"
version = "0.1.0"
description = "Keep an LLM's whole answer when it fails a Pydantic model, with its error on its row, and rerun the model only for the rows that failed."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pixeltable>=0.7.25",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
]

[[tool.pixeltable.database]]
# The local database. vars.<name> sets the value of the ConfigVar called <name>, for example:
# vars.media_dest = 's3://bucket/prefix'
# A hosted database gets a second entry, with name = 'pxt://org:db'.
