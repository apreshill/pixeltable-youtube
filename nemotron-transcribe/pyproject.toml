[project]
name = "nemotron-transcribe"
version = "0.1.0"
description = "Transcribe a recording with NVIDIA Nemotron 3.5 Transcribe from Hugging Face. The prompt is a column."
requires-python = ">=3.11"
dependencies = [
    "openai>=3.40.0",
    "pixeltable>=0.7.14",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
]

[[tool.pixeltable.database]]
# The local database. vars.<name> sets the value of the ConfigVar called <name>, for example:
# vars.media_dest = 's3://bucket/prefix'
# A hosted database gets a second entry, with name = 'pxt://org:db'.
