[project]
name = "trace-answers-to-media"
version = "0.1.0"
description = "Keep each Gemini answer on the same row as the photo it read, and follow each call in Logfire."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.6.1",
    "logfire>=6.0.1",
    "pixeltable[otel]>=0.7.25",
    "pydantic-ai-slim>=2.71.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
]

[[tool.pixeltable.database]]
# The local database. vars.<name> sets the value of the ConfigVar called <name>, for example:
# vars.media_dest = 's3://bucket/prefix'
# A hosted database gets a second entry, with name = 'pxt://org:db'.
