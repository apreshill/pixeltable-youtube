[project]
name = "otel-tracing"
version = "0.1.0"
description = "Trace one video insert in Phoenix with OpenTelemetry: the download, each frame, and each OpenAI call with its tokens."
requires-python = ">=3.11"
dependencies = [
    "openai>=3.0",
    "openinference-instrumentation-openai>=0.1.73",
    "pixeltable[otel]>=0.7.24",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
]

[[tool.pixeltable.database]]
# The local database. vars.<name> sets the value of the ConfigVar called <name>, for example:
# vars.media_dest = 's3://bucket/prefix'
# A hosted database gets a second entry, with name = 'pxt://org:db'.
