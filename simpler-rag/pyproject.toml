[project]
name = "simpler-rag"
version = "0.1.0"
description = "Multimodal RAG notebook: title search, query rewriting, captions, image embeddings, and answers with Pixeltable."
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pixeltable>=0.7.11",
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]

[tool.uv]
package = false

[[tool.pixeltable.database]]
# The local database. vars and secrets bind the config vars a schema declares; a hosted database is
# a second entry, named by its uri.
# vars.media_dest = 's3://bucket/prefix'
# secrets.openai_api_key = '...'
